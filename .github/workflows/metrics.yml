name: Metrics
on:
  schedule:
    - cron: "0 7 * * *" # diario a las 07:00 UTC (~04:00 Santiago)
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          # Commitea el SVG directo a este repo en vez de servirlo desde un
          # endpoint externo — carga instantánea y no depende de que el
          # servicio de lowlighter esté arriba cuando alguien visite el perfil.
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg

          # Con METRICS_TOKEN (un PAT con scope repo) cuenta también la
          # actividad de repos PRIVADOS en los totales — nunca expone sus
          # nombres, solo suma al conteo.
          user: ManuelGarreton
          template: classic
          base: header, repositories, metadata
          config_timezone: America/Santiago

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
