<!doctype html>
<!--
  mg-chat-bubble: one continuous particle field (1500 dots) for a looping
  1920x400 GitHub banner.

  scatter -> "MG" monogram (0-0.5s) -> hold + breathe (0.5-1.4s)
  -> turbulent swarm into a chat bubble (1.4-2.3s) -> hold + outline pulse
  (2.3-3.3s) -> relax back to the scatter (3.3-3.8s).

  Technique donor: particle-text-dissolve (fixed-seed LCG, offscreen raster
  + getImageData grid sampling, zero per-particle tweens, one onUpdate that
  repaints the whole canvas as a pure function of (table, time)).

  Deviation from donor: the "MG" target is rastered from a hand-drawn,
  font-independent vector path (geometric heavy strokes in the Inter Black
  spirit), not fillText, so sampling never depends on webfont load timing.

  Loop closure: scatter drift has period == duration and uses (t mod D),
  so paint(0) and paint(3.8) evaluate the exact same numbers.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MG Chat Bubble Particles</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #0d1117;
          pointer-events: none;
        }
        #mg-field-clip {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #mg-field {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          display: block;
        }
      </style>

      <div
        id="root"
        data-composition-id="mg-chat-bubble"
        data-start="0"
        data-duration="3.8"
        data-fps="30"
        data-width="1920"
        data-height="400"
      >
        <div
          id="mg-field-clip"
          class="clip"
          data-start="0"
          data-duration="3.8"
          data-track-index="0"
        >
          <canvas id="mg-field" aria-hidden="true"></canvas>
        </div>
      </div>

      <script>
        (function () {
          "use strict";

          // ---------------------------------------------------------------
          // Constants (palette + timing in one place)
          // ---------------------------------------------------------------
          var PALETTE = {
            bg: [13, 17, 23], // #0d1117
            core: [167, 139, 250], // #a78bfa
            light: [196, 181, 253], // #c4b5fd
          };
          var W = 1920;
          var H = 400;
          var D = 3.8;
          var N = 1500;
          var N_OUTLINE = 520;
          var N_FILL = N - N_OUTLINE;

          var T_MG_END = 0.5; // MG fully converged (beat)
          var T_MORPH = 1.4; // pattern interrupt (beat)
          var T_MORPH_LEAD = 1.32; // ease off MG in the last ~0.1s of hold
          var T_BUBBLE = 2.3; // bubble locked (beat)
          var T_BRIDGE = 3.3; // relax back to scatter (beat)

          var A_SCATTER = 0.28;
          var A_MG = 0.92;
          var A_OUTLINE = 0.9;
          var A_FILL = 0.45;
          var R_SCATTER = 1.6;
          var R_MG = 2.7;
          var R_OUTLINE = 2.0;
          var R_FILL = 1.9;

          var root = document.getElementById("root");
          var canvas = document.getElementById("mg-field");

          // Raster basis fixed once at mount.
          var dpr = Math.min(2, Math.max(1, Number(window.devicePixelRatio) || 1));
          canvas.width = Math.round(W * dpr);
          canvas.height = Math.round(H * dpr);
          var ctx = canvas.getContext("2d");

          // ---------------------------------------------------------------
          // Seeded LCG (fixed seed, never wall-clock derived)
          // ---------------------------------------------------------------
          var seed = 0x9d1550f7;
          function rnd() {
            seed = (Math.imul(1664525, seed) + 1013904223) >>> 0;
            return seed / 4294967296;
          }

          // ---------------------------------------------------------------
          // Target shapes, drawn in design space (1920x400) offscreen
          // ---------------------------------------------------------------
          var doc = root.ownerDocument;
          function makeOff() {
            var c = doc.createElement("canvas");
            c.width = W;
            c.height = H;
            var x = c.getContext("2d", { willReadFrequently: true });
            x.fillStyle = "#ffffff";
            x.strokeStyle = "#ffffff";
            return { c: c, x: x };
          }
          function litCells(off, step) {
            var data = off.x.getImageData(0, 0, W, H).data;
            var out = [];
            for (var gy = 0; Math.round(gy * step) < H; gy += 1) {
              var y = Math.round(gy * step);
              for (var gx = 0; Math.round(gx * step) < W; gx += 1) {
                var x = Math.round(gx * step);
                if (data[(y * W + x) * 4 + 3] > 127) out.push({ x: x, y: y });
              }
            }
            return out;
          }
          // Regular dot-matrix: widen the grid step until the lit-cell count
          // is just above n, then trim the small excess with the LCG.
          function gridExact(off, n, step0) {
            var step = step0;
            var cells = litCells(off, step);
            while (cells.length > n * 1.01 && step < 40) {
              step += 0.02;
              cells = litCells(off, step);
            }
            return pickExact(cells, n);
          }
          // Evenly spaced along the outline: order cells by angle around the
          // body center, then take every k-th one (no random gaps).
          function evenAlong(cells, n, cx, cy) {
            var arr = cells.slice().sort(function (a, b) {
              return Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx);
            });
            var res = [];
            for (var i = 0; i < n; i += 1) {
              res.push(arr[Math.floor((i * arr.length) / n) % arr.length]);
            }
            return res;
          }
          // Exact-count deterministic thinning: partial Fisher-Yates driven
          // by the LCG (one draw per kept cell), so every set has exactly n.
          function pickExact(cells, n) {
            var arr = cells.slice();
            var take = Math.min(n, arr.length);
            for (var i = 0; i < take; i += 1) {
              var j = i + Math.floor(rnd() * (arr.length - i));
              var tmp = arr[i];
              arr[i] = arr[j];
              arr[j] = tmp;
            }
            var res = arr.slice(0, take);
            // Pad (never expected) by reusing cells so pairing stays 1:1.
            for (var k = 0; res.length < n && arr.length > 0; k += 1) {
              res.push(arr[k % arr.length]);
            }
            return res;
          }

          // --- MG monogram: geometric heavy strokes, font-independent -----
          var GH = 272; // glyph height (~68% of canvas)
          var S = 64; // stroke mass (Black weight)
          var MW = 262; // M width
          var GAP = 46;
          var GW = GH; // G is a full circle bowl
          var totalW = MW + GAP + GW;
          var gx0 = Math.round((W - totalW) / 2);
          var gy0 = Math.round((H - GH) / 2);

          var mgOff = makeOff();
          (function drawMG(c) {
            // M: two stems + two diagonals meeting at a low vertex.
            var x0 = gx0;
            var y0 = gy0;
            c.fillRect(x0, y0, S, GH);
            c.fillRect(x0 + MW - S, y0, S, GH);
            var vx = x0 + MW / 2;
            var vy = y0 + GH * 0.74;
            c.beginPath();
            c.moveTo(x0, y0);
            c.lineTo(x0 + S * 1.15, y0);
            c.lineTo(vx + S * 0.5, vy - S * 0.2);
            c.lineTo(vx + S * 0.5, vy + S * 0.55);
            c.lineTo(vx - S * 0.5, vy + S * 0.55);
            c.closePath();
            c.fill();
            c.beginPath();
            c.moveTo(x0 + MW, y0);
            c.lineTo(x0 + MW - S * 1.15, y0);
            c.lineTo(vx - S * 0.5, vy - S * 0.2);
            c.lineTo(vx - S * 0.5, vy + S * 0.55);
            c.lineTo(vx + S * 0.5, vy + S * 0.55);
            c.closePath();
            c.fill();

            // G: open bowl (gap at upper right) + crossbar + spur.
            var cx = gx0 + MW + GAP + GW / 2;
            var cy = y0 + GH / 2;
            var R = GH / 2 - S / 2;
            c.lineWidth = S;
            c.lineCap = "butt";
            c.beginPath();
            c.arc(cx, cy, R, 0.02, Math.PI * 2 - 0.72, false);
            c.stroke();
            // crossbar from the center to the outer right edge
            c.fillRect(cx + 4, cy - 2, R + S / 2 - 4, S * 0.86);
            // short spur closing the right side below the bar
            c.fillRect(cx + R - S / 2, cy - 2, S, R * 0.55);
          })(mgOff.x);

          var mgCells = gridExact(mgOff, N, 3);

          // --- Chat bubble: rounded body + lower-left tail --------------
          var BW = 470;
          var BH = 232;
          var BR = 74;
          var bx = Math.round((W - BW) / 2);
          var by = Math.round((H - BH) / 2) - 22;
          var tailBaseL = bx + 70;
          var tailBaseR = bx + 168;
          var tailTipX = bx + 28;
          var tailTipY = by + BH + 62;

          function bubblePath(c) {
            c.beginPath();
            c.moveTo(bx + BR, by);
            c.lineTo(bx + BW - BR, by);
            c.arcTo(bx + BW, by, bx + BW, by + BR, BR);
            c.lineTo(bx + BW, by + BH - BR);
            c.arcTo(bx + BW, by + BH, bx + BW - BR, by + BH, BR);
            c.lineTo(tailBaseR, by + BH);
            // tail: gentle curve down to the tip, back up into the body
            c.quadraticCurveTo(tailBaseR - 40, by + BH + 34, tailTipX, tailTipY);
            c.quadraticCurveTo(tailBaseL - 6, by + BH + 26, tailBaseL - 18, by + BH - 6);
            c.arcTo(bx, by + BH, bx, by + BH - BR, BR * 0.62);
            c.lineTo(bx, by + BR);
            c.arcTo(bx, by, bx + BR, by, BR);
            c.closePath();
          }

          var outlineOff = makeOff();
          bubblePath(outlineOff.x);
          outlineOff.x.lineWidth = 2;
          outlineOff.x.lineJoin = "round";
          outlineOff.x.stroke();

          // Fill interior, kept clear of the outline band.
          var fillOff = makeOff();
          bubblePath(fillOff.x);
          fillOff.x.fill();
          fillOff.x.globalCompositeOperation = "destination-out";
          fillOff.x.lineWidth = 26;
          fillOff.x.lineJoin = "round";
          fillOff.x.stroke();
          fillOff.x.globalCompositeOperation = "source-over";

          var outlineCells = evenAlong(litCells(outlineOff, 1), N_OUTLINE, bx + BW / 2, by + BH / 2);
          var fillCells = gridExact(fillOff, N_FILL, 4);
          var bubbleCells = [];
          for (var oi = 0; oi < outlineCells.length; oi += 1) {
            bubbleCells.push({ x: outlineCells[oi].x, y: outlineCells[oi].y, outline: true });
          }
          for (var fi = 0; fi < fillCells.length; fi += 1) {
            bubbleCells.push({ x: fillCells[fi].x, y: fillCells[fi].y, outline: false });
          }

          // --- Scatter: fixed random base positions over the whole banner -
          var scatterCells = [];
          for (var si = 0; si < N; si += 1) {
            scatterCells.push({ x: 30 + rnd() * (W - 60), y: 24 + rnd() * (H - 48) });
          }

          // Rank-pair all three sets by x (ties by y) so motion flows
          // coherently left-to-right instead of criss-crossing.
          function byX(a, b) {
            return a.x - b.x || a.y - b.y;
          }
          mgCells.sort(byX);
          bubbleCells.sort(byX);
          scatterCells.sort(byX);

          var mgMinX = mgCells[0].x;
          var mgSpan = Math.max(1, mgCells[N - 1].x - mgMinX);
          var bMinX = bubbleCells[0].x;
          var bSpan = Math.max(1, bubbleCells[N - 1].x - bMinX);

          // ---------------------------------------------------------------
          // Particle table — computed once, read-only afterwards
          // ---------------------------------------------------------------
          var P = [];
          for (var i = 0; i < N; i += 1) {
            var mg = mgCells[i];
            var bb = bubbleCells[i];
            var sc = scatterCells[i];
            var keyMg = (mg.x - mgMinX) / mgSpan; // 0..1 across the glyph
            var keyB = (bb.x - bMinX) / bSpan;
            var outline = bb.outline;
            // Assembly: front sweeps left->right, all landed by 0.5s.
            var aStart = 0.17 * keyMg + 0.03 * rnd();
            var aDur = T_MG_END - aStart; // lands exactly by the beat
            // Morph: outline leads fill so the silhouette reads first.
            var mStart = T_MORPH_LEAD + 0.1 * keyB + (outline ? 0 : 0.05) + 0.02 * rnd();
            var mEnd = outline ? T_BUBBLE - 0.08 : T_BUBBLE;
            // Bridge: slight stagger, every particle ends exactly at D.
            var bStart = T_BRIDGE + 0.08 * keyB * rnd();
            P.push({
              sx: sc.x,
              sy: sc.y,
              mx: mg.x + 1.5,
              my: mg.y + 1.5,
              bx: bb.x + (outline ? 1 : 2),
              by: bb.y + (outline ? 1 : 2),
              outline: outline,
              ax: 6 + 10 * rnd(), // drift amplitude
              ay: 4 + 7 * rnd(),
              ph1: rnd() * Math.PI * 2,
              ph2: rnd() * Math.PI * 2,
              tph: rnd() * Math.PI * 2, // turbulence phase
              aStart: aStart,
              aDur: aDur,
              mStart: mStart,
              mDur: mEnd - mStart,
              bStart: bStart,
              bDur: D - bStart,
              dim: 0.82 + 0.18 * rnd(),
            });
          }

          // ---------------------------------------------------------------
          // Pure math helpers (allowed ease families only)
          // ---------------------------------------------------------------
          function clamp01(v) {
            return v < 0 ? 0 : v > 1 ? 1 : v;
          }
          function power3Out(u) {
            return 1 - Math.pow(1 - u, 3);
          }
          function power2In(u) {
            return u * u;
          }
          function power2Out(u) {
            return 1 - (1 - u) * (1 - u);
          }
          function power2InOut(u) {
            return u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
          }
          // power2.in start -> power3.out landing (blended)
          function assembleEase(u) {
            return (1 - u) * power2In(u) + u * power3Out(u);
          }
          function lerp(a, b, k) {
            return a + (b - a) * k;
          }
          function mixColor(a, b, k) {
            return (
              "rgb(" +
              Math.round(lerp(a[0], b[0], k)) +
              "," +
              Math.round(lerp(a[1], b[1], k)) +
              "," +
              Math.round(lerp(a[2], b[2], k)) +
              ")"
            );
          }
          var CORE = mixColor(PALETTE.core, PALETTE.core, 0);
          var TWO_PI = Math.PI * 2;
          var OMEGA = TWO_PI / D;

          // ---------------------------------------------------------------
          // Global multipliers (single collective signals, no flicker)
          // ---------------------------------------------------------------
          function globalAlpha(t) {
            // MG hold breathing: one full sine cycle, +/-8%.
            if (t >= T_MG_END && t < T_MORPH) {
              return 1 + 0.08 * Math.sin((TWO_PI * (t - T_MG_END)) / (T_MORPH - T_MG_END));
            }
            // Interrupt spike ~1.15x at the handoff, eased back down.
            if (t >= T_MORPH && t < T_BUBBLE) {
              var k = clamp01((t - T_MORPH) / (T_BUBBLE - T_MORPH));
              return 1 + 0.15 * Math.sin(Math.PI * Math.min(1, k * 1.6)) * (1 - power2Out(k) * 0.4);
            }
            return 1;
          }
          function outlinePulse(t) {
            // #a78bfa -> #c4b5fd -> #a78bfa, one cycle across the hold.
            if (t < T_BUBBLE || t > T_BRIDGE) return 0;
            return 0.5 - 0.5 * Math.cos((TWO_PI * (t - T_BUBBLE)) / (T_BRIDGE - T_BUBBLE));
          }

          // ---------------------------------------------------------------
          // Pure repaint: frame = f(table, t)
          // ---------------------------------------------------------------
          function paint(time) {
            var t = time < 0 ? 0 : time > D ? D : time;
            var tt = t % D; // loop-exact drift clock: tt(3.8) === tt(0)
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            var G = globalAlpha(t);
            var pulse = outlinePulse(t);
            var outlineColor = mixColor(PALETTE.core, PALETTE.light, pulse);

            for (var i = 0; i < N; i += 1) {
              var p = P[i];
              // Scatter position with periodic drift (period == D).
              var sx = p.sx + p.ax * Math.sin(OMEGA * tt + p.ph1);
              var sy = p.sy + p.ay * Math.sin(OMEGA * tt + p.ph2);

              var x, y, a, r, color;
              color = CORE;

              if (t <= T_MG_END) {
                // Scene 1a: scatter -> MG
                var u = clamp01((t - p.aStart) / p.aDur);
                var e = assembleEase(u);
                x = lerp(sx, p.mx, e);
                y = lerp(sy, p.my, e);
                a = lerp(A_SCATTER, A_MG, e);
                r = lerp(R_SCATTER, R_MG, e);
              } else if (t < T_BRIDGE) {
                // Scenes 1b-3: MG hold -> swarm -> bubble hold
                var mu = clamp01((t - p.mStart) / p.mDur);
                var me = power2Out(mu);
                var env = Math.sin(Math.PI * mu); // 0 at both ends
                // Shared sum-of-sines turbulence field (coherent, seeded).
                var fx = p.mx * 0.011 + p.my * 0.007;
                var tx =
                  46 * Math.sin(7.3 * t + fx + p.tph) + 18 * Math.sin(13.1 * t + p.my * 0.02);
                var ty =
                  30 * Math.sin(9.1 * t + fx + p.tph + 1.3) +
                  12 * Math.sin(15.7 * t + p.mx * 0.017);
                x = lerp(p.mx, p.bx, me) + tx * env;
                y = lerp(p.my, p.by, me) + ty * env;
                var aTo = p.outline ? A_OUTLINE : A_FILL;
                var rTo = p.outline ? R_OUTLINE : R_FILL;
                a = lerp(A_MG, aTo, me);
                r = lerp(R_MG, rTo, me);
                if (p.outline && mu >= 1) {
                  color = outlineColor;
                  r = R_OUTLINE + 0.35 * pulse;
                  a = A_OUTLINE + 0.08 * pulse;
                }
              } else {
                // Scene 4: bubble -> scatter, ends exactly at scatter(D).
                var bu = clamp01((t - p.bStart) / p.bDur);
                var be = power2InOut(bu);
                x = lerp(p.bx, sx, be);
                y = lerp(p.by, sy, be);
                var aFrom = p.outline ? A_OUTLINE : A_FILL;
                var rFrom = p.outline ? R_OUTLINE : R_FILL;
                a = lerp(aFrom, A_SCATTER, be);
                r = lerp(rFrom, R_SCATTER, be);
              }

              var alpha = clamp01(a * G * p.dim);
              if (alpha <= 0.002) continue;
              ctx.globalAlpha = alpha;
              ctx.fillStyle = color;
              ctx.beginPath();
              ctx.arc(x, y, r, 0, TWO_PI);
              ctx.fill();
            }
            ctx.globalAlpha = 1;
          }

          // ---------------------------------------------------------------
          // Timeline: one paused timeline, one anchor tween, one painter
          // ---------------------------------------------------------------
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({
            paused: true,
            onUpdate: function () {
              paint(tl.time());
            },
          });
          // Inert anchor spanning the full duration so every eventful seek
          // in [0, D] repaints.
          tl.to({ p: 0 }, { p: 1, duration: D, ease: "none" }, 0);

          window.__timelines["mg-chat-bubble"] = tl;
          paint(0);
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
